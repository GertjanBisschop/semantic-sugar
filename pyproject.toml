[project]
name = "semantic-sugar"
version = "0.0.1"
description = "Project RDF graphs onto Pydantic models and back"
readme = "README.md"
authors = [
    { name = "Gertjan Bisschop", email = "gertjan.bisschop@vliz.be" }
]
requires-python = ">=3.11"
dependencies = ["rdflib>=7", "pydantic>=2.7", "typing_extensions"]

[dependency-groups]
dev = [
    "pyright (>=1.1.408,<2.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
	"pre-commit (>=4.7,<5)",
]

docs = [
    "zensical",
	"markdown-exec[ansi]"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.sdist]
include = [
    "src/semantic_sugar/",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/semantic_sugar/",
	"src/semantic_sugar/py.typed",
]

[tool.hatch.build.targets.wheel.sources]
"src/semantic_sugar" = "semantic_sugar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
# Same as Black.
line-length  = 79
indent-width = 4

# Lowest supported Python version, see [project] requires-python.
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable   = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# Exclude a variety of commonly ignored directories.
exclude = [
	".bzr",
	".direnv",
	".eggs",
	".git",
	".git-rewrite",
	".hg",
	".ipynb_checkpoints",
	".mypy_cache",
	".nox",
	".pants.d",
	".pyenv",
	".pytest_cache",
	".pytype",
	".ruff_cache",
	".svn",
	".tox",
	".venv",
	".vscode",
	"__pypackages__",
	"_build",
	"buck-out",
	"build",
	"dist",
	"node_modules",
	"site-packages",
	"venv",
]